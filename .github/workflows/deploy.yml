name: Deploy Pipeline

on:
  workflow_dispatch:

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start application (TEST)
        run: |
          nohup python app.py &
          sleep 5

      - name: Health check (TEST)
        run: |
          curl -v http://localhost:5000/

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-test
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start application (PROD)
        run: |
          nohup python app.py &
          sleep 5

      - name: Health check (PROD)
        run: |
          curl -v http://localhost:5000/

      - name: Monitoring
        run: |
          curl -v http://localhost:5000/status